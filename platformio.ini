; M5StickC PLUS -> BLE presentation remote for iPad
;
; platform: the pioarduino community fork, because the official espressif32
; platform is still on arduino-esp32 2.0.x and the BLE HID library we use
; needs core 3.x. Stable currently ships Arduino 3.3.11 / IDF 5.5.5.
;
; board: our own definition in boards/m5stick-c-plus.json. The platform only ships
; a stale "m5stick-c" whose variant name predates arduino-esp32 3.x (build fails on
; pins_arduino.h) and whose -DARDUINO_M5Stick_C would select the original StickC's
; 80x160 screen instead of the PLUS's 135x240.

[env:m5stick-c-plus]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stick-c-plus
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

; The default 4MB layout gives the app only ~1.3MB, and M5Unified + NimBLE + HID
; lands uncomfortably close to that. huge_app gives 3MB and drops OTA (unused).
board_build.partitions = huge_app.csv

lib_deps =
    m5stack/M5Unified@^0.2.7
    h2zero/NimBLE-Arduino@^2.3.8
    HijelHub/HijelHID_BLEKeyboard

build_flags =
    -DCORE_DEBUG_LEVEL=1
